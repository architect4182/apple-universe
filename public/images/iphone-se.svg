
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" width="100%" height="100%">
  <defs>
    <linearGradient id="seGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a4a50"/>
      <stop offset="100%" stop-color="#111115"/>
    </linearGradient>
    <linearGradient id="seWallpaper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b30"/>
      <stop offset="100%" stop-color="#ff9500"/>
    </linearGradient>
    <linearGradient id="glare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.15"/>
      <stop offset="30%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Body -->
  <rect x="20" y="20" width="360" height="760" rx="45" fill="url(#seGradient)"/>
  
  <!-- Bezel (Thick) -->
  <rect x="24" y="24" width="352" height="752" rx="40" fill="#050505"/>
  
  <!-- Screen -->
  <rect x="24" y="110" width="352" height="580" fill="url(#seWallpaper)"/>
  
  <!-- Screen Glare overlay -->
  <rect x="24" y="24" width="352" height="752" rx="40" fill="url(#glare)"/>
  
  <!-- Top Bezel Details -->
  <rect x="160" y="60" width="80" height="6" rx="3" fill="#222"/>
  <circle cx="120" cy="63" r="6" fill="#111"/>
  <circle cx="120" cy="63" r="2" fill="#001144"/>

  <!-- Home Button (Touch ID) -->
  <circle cx="200" cy="735" r="25" fill="#000" stroke="#222" stroke-width="2"/>
  <circle cx="200" cy="735" r="21" fill="none" stroke="#555" stroke-width="1"/>
  
  <!-- Buttons -->
  <path d="M 16 120 L 20 120 L 20 150 L 16 150 Q 14 135 16 120" fill="url(#seGradient)"/> <!-- Mute -->
  <path d="M 16 180 L 20 180 L 20 230 L 16 230 Q 14 205 16 180" fill="url(#seGradient)"/> <!-- Vol Up -->
  <path d="M 16 250 L 20 250 L 20 300 L 16 300 Q 14 275 16 250" fill="url(#seGradient)"/> <!-- Vol Down -->
  <path d="M 380 180 L 384 180 Q 386 215 384 250 L 380 250 L 380 180" fill="url(#seGradient)"/> <!-- Power -->
</svg>